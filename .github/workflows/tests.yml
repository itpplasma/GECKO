name: Open geometry tests

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "8"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      FC: gfortran
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Match the public SIMPLE/libneo source-build dependencies.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gfortran pkg-config libfftw3-dev libgsl-dev \
            libhdf5-dev libnetcdf-dev libopenblas-dev liblapack-dev \
            libopenmpi-dev openmpi-bin
      - name: Install libneo from source
        run: |
          python -m pip install numpy scipy netCDF4 scikit-build-core f90wrap==0.3.0
          git clone https://github.com/itpplasma/libneo.git .ci-deps/libneo
          git -C .ci-deps/libneo checkout f6090e8150c2f5b1c0afde09baadf79b50b1ffe7
          python -m pip install --no-build-isolation .ci-deps/libneo \
            -Ccmake.define.LIBNEO_BUILD_TESTING=OFF
      - name: Install GECKO with mesh and STEP dependencies
        run: |
          python -m pip install -e ".[dev,step]"
          python -c "import cadquery, OCP; print('CadQuery', cadquery.__version__, 'OCP', OCP.__version__)"
      - name: Test public geometry and report explicit private skips
        env:
          GECKO_STEP_ARTIFACT_DIR: artifacts/step
        run: python -m pytest python/tests -v -ra --junitxml=artifacts/pytest.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pytest-results
          path: |
            artifacts/pytest.xml
            artifacts/step/*.csv
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
